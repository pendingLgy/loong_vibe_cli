[project]
name = "vibe-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "loong", email = "amzinglgy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "loguru>=0.7.3",
    "psycopg-binary>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
vibe-cli = "vibe_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
